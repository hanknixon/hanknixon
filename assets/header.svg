<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="340" viewBox="0 0 1000 340" role="img" aria-label="Hank Nixon, software engineer and designer">
  <defs>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#34343C"/>
    </pattern>
    <clipPath id="card"><rect width="1000" height="340" rx="16"/></clipPath>
    <clipPath id="strip"><rect x="0" y="282" width="1000" height="58"/></clipPath>
  </defs>
  <g clip-path="url(#card)" font-family="Outfit, 'Segoe UI', Helvetica, Arial, sans-serif">
    <rect width="1000" height="340" fill="#1D1D22"/>
    <rect width="1000" height="340" fill="url(#dots)"/>
    <rect x="0.5" y="0.5" width="999" height="339" rx="16" fill="none" stroke="#2E2E36"/>

    <!-- availability pill -->
    <g transform="translate(56,40)">
      <rect width="262" height="34" rx="17" fill="none" stroke="#4ADE80" stroke-opacity="0.5"/>
      <circle cx="20" cy="17" r="5" fill="#4ADE80">
        <animate attributeName="opacity" values="1;0.25;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="36" y="22.5" font-size="15" fill="#4ADE80">Open to work · UAE / GCC</text>
    </g>

    <!-- name -->
    <text x="56" y="140" font-size="28" fill="#9CA3AF" opacity="0">Hello, I'm
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
    </text>
    <text x="52" y="226" font-size="104" font-weight="800" fill="#FFFFFF" opacity="0" letter-spacing="-2">Hank <tspan fill="#4ADE80">Nixon</tspan>
      <animate attributeName="opacity" from="0" to="1" dur="0.8s" begin="0.4s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 16" to="0 0" dur="0.8s" begin="0.4s" fill="freeze"/>
    </text>

    <!-- rotating roles (top right) -->
    <g font-size="22" fill="#FFFFFF" text-anchor="end">
      <text x="944" y="64" opacity="0">Software Engineer
        <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.04;0.22;0.26;1" dur="12s" begin="1s" repeatCount="indefinite"/>
      </text>
      <text x="944" y="64" opacity="0">Backend &amp; Full-Stack Developer
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.25;0.29;0.47;0.51;1" dur="12s" begin="1s" repeatCount="indefinite"/>
      </text>
      <text x="944" y="64" opacity="0">UI/UX &amp; Graphic Designer
        <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.50;0.54;0.72;0.76;1" dur="12s" begin="1s" repeatCount="indefinite"/>
      </text>
      <text x="944" y="64" opacity="0">Learning · Building · Evolving
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.75;0.79;0.97;1" dur="12s" begin="1s" repeatCount="indefinite"/>
      </text>
    </g>
    <rect x="956" y="46" width="3" height="24" fill="#4ADE80">
      <animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
    </rect>

    <!-- tech marquee -->
    <rect x="0" y="282" width="1000" height="58" fill="#25252B"/>
    <line x1="0" y1="282.5" x2="1000" y2="282.5" stroke="#2E2E36"/>
    <g clip-path="url(#strip)">
      <g>
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-1500 0" dur="38s" repeatCount="indefinite"/>
        <text x="0" y="318" font-size="18" fill="#9CA3AF" textLength="1500" lengthAdjust="spacing" xml:space="preserve">Python  •  React.js  •  Next.js  •  FastAPI  •  TypeScript  •  Node.js  •  Java  •  JavaScript  •  PostgreSQL  •  Dart  •  Flutter  •  Product Design  •  Research  •  Development  •  </text>
        <text x="1500" y="318" font-size="18" fill="#9CA3AF" textLength="1500" lengthAdjust="spacing" xml:space="preserve">Python  •  React.js  •  Next.js  •  FastAPI  •  TypeScript  •  Node.js  •  Java  •  JavaScript  •  PostgreSQL  •  Dart  •  Flutter  •  Product Design  •  Research  •  Development  •  </text>
      </g>
    </g>
  </g>
</svg>
