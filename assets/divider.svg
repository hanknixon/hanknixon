<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="6" viewBox="0 0 1000 6" preserveAspectRatio="none" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1000" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f0abfc"/>
      <animate attributeName="x1" values="0;-1000" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1000;0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="6" rx="3" fill="url(#g)"/>
</svg>
