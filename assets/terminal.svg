<svg xmlns="http://www.w3.org/2000/svg" width="800" height="270" viewBox="0 0 800 270" role="img" aria-label="Terminal: hank, backend and full-stack engineer, open to roles in UAE and GCC">
  <defs>
    <clipPath id="c1"><rect x="40" y="62" width="0" height="30"><animate attributeName="width" from="0" to="300" dur="0.6s" begin="0.5s" fill="freeze"/></rect></clipPath>
    <clipPath id="c2"><rect x="40" y="92" width="0" height="30"><animate attributeName="width" from="0" to="720" dur="1.2s" begin="1.4s" fill="freeze"/></rect></clipPath>
    <clipPath id="c3"><rect x="40" y="122" width="0" height="30"><animate attributeName="width" from="0" to="300" dur="0.8s" begin="2.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c4"><rect x="40" y="152" width="0" height="30"><animate attributeName="width" from="0" to="720" dur="1.4s" begin="3.9s" fill="freeze"/></rect></clipPath>
    <clipPath id="c5"><rect x="40" y="182" width="0" height="30"><animate attributeName="width" from="0" to="320" dur="0.8s" begin="5.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="c6"><rect x="40" y="212" width="0" height="30"><animate attributeName="width" from="0" to="720" dur="1.5s" begin="6.6s" fill="freeze"/></rect></clipPath>
    <clipPath id="win"><rect width="800" height="270" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#win)">
    <rect width="800" height="270" fill="#0d1117"/>
    <rect width="800" height="40" fill="#161b22"/>
    <circle cx="26" cy="20" r="6" fill="#ff5f56"/>
    <circle cx="48" cy="20" r="6" fill="#ffbd2e"/>
    <circle cx="70" cy="20" r="6" fill="#27c93f"/>
    <text x="400" y="25" text-anchor="middle" font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="13" fill="#8b949e">hank@portfolio: ~</text>

    <g font-family="SFMono-Regular, Consolas, Menlo, monospace" font-size="17">
      <g clip-path="url(#c1)"><text x="40" y="84" fill="#7ee787" textLength="86" lengthAdjust="spacingAndGlyphs">$ whoami</text></g>
      <g clip-path="url(#c2)"><text x="40" y="114" fill="#e6edf3" textLength="396" lengthAdjust="spacingAndGlyphs">hank · backend &amp; full-stack engineer</text></g>
      <g clip-path="url(#c3)"><text x="40" y="144" fill="#7ee787" textLength="150" lengthAdjust="spacingAndGlyphs">$ cat focus.txt</text></g>
      <g clip-path="url(#c4)"><text x="40" y="174" fill="#e6edf3" textLength="420" lengthAdjust="spacingAndGlyphs">APIs · databases · RBAC · LLM pipelines</text></g>
      <g clip-path="url(#c5)"><text x="40" y="204" fill="#7ee787" textLength="165" lengthAdjust="spacingAndGlyphs">$ cat status.txt</text></g>
      <g clip-path="url(#c6)"><text x="40" y="234" fill="#79c0ff" textLength="470" lengthAdjust="spacingAndGlyphs">open to roles in UAE / GCC · relocation OK</text></g>
    </g>

    <!-- blinking cursor after last line -->
    <rect x="522" y="219" width="10" height="18" fill="#e6edf3" opacity="0">
      <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.01;0.5;0.51;1" dur="1.1s" begin="8.1s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
