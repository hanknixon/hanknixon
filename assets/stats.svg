<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="104" viewBox="0 0 1000 104" role="img" aria-label="3+ years of experience, 20+ projects, 5+ deployed, IEEE published research">
  <g font-family="Outfit, 'Segoe UI', Helvetica, Arial, sans-serif">
    <g transform="translate(0,0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.2s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="0 12" to="0 0" dur="0.6s" begin="0.2s" fill="freeze"/>
      <rect width="232" height="104" rx="12" fill="#25252B" stroke="#2E2E36"/>
      <text x="24" y="58" font-size="44" font-weight="800" fill="#4ADE80">3+</text>
      <text x="24" y="86" font-size="15" fill="#9CA3AF">Years of experience</text>
    </g>
    <g transform="translate(256,0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.38s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="256 12" to="256 0" dur="0.6s" begin="0.38s" fill="freeze"/>
      <rect width="232" height="104" rx="12" fill="#25252B" stroke="#2E2E36"/>
      <text x="24" y="58" font-size="44" font-weight="800" fill="#4ADE80">20+</text>
      <text x="24" y="86" font-size="15" fill="#9CA3AF">Projects worked on</text>
    </g>
    <g transform="translate(512,0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.56s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="512 12" to="512 0" dur="0.6s" begin="0.56s" fill="freeze"/>
      <rect width="232" height="104" rx="12" fill="#25252B" stroke="#2E2E36"/>
      <text x="24" y="58" font-size="44" font-weight="800" fill="#4ADE80">5+</text>
      <text x="24" y="86" font-size="15" fill="#9CA3AF">Projects deployed</text>
    </g>
    <g transform="translate(768,0)" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.6s" begin="0.74s" fill="freeze"/>
      <animateTransform attributeName="transform" type="translate" from="768 12" to="768 0" dur="0.6s" begin="0.74s" fill="freeze"/>
      <rect width="232" height="104" rx="12" fill="#25252B" stroke="#2E2E36"/>
      <text x="24" y="58" font-size="44" font-weight="800" fill="#4ADE80">IEEE</text>
      <text x="24" y="86" font-size="15" fill="#9CA3AF">Published research</text>
    </g>
  </g>
</svg>
